  summary:
    es: Diseño, desarrollo y pongo en producción aplicaciones web y móviles, de la interfaz a la base de datos. Más de 9 años creando productos digitales, con la mirada de alguien que viene del diseño gráfico.
    en: I design, build and ship web and mobile apps, from the interface to the database. Over 9 years creating digital products, with the eye of someone who comes from graphic design.

  about:
    - es: En el frontend trabajo con React, Next.js y React Native. En el backend, con Python (Django y Flask), Node.js, PostgreSQL y Supabase. Despliego en plataformas como Vercel y Cloudflare.
      en: On the frontend I work with React, Next.js and React Native. On the backend, with Python (Django and Flask), Node.js, PostgreSQL and Supabase. I deploy on platforms like Vercel and Cloudflare.
    - es: Desarrollé plataformas SaaS con IA, sistemas en tiempo real, pagos, autenticación segura, paneles de administración, reportes y flujos automatizados, incluidas arquitecturas alineadas con HIPAA.
      en: I have built AI-powered SaaS platforms, real-time systems, payments, secure authentication, admin dashboards, reporting tools and automated workflows, including HIPAA-aligned architectures.
    - es: Mi base en diseño gráfico es mi diferencial. Pienso cada pantalla como una pieza de diseño, con jerarquía clara, buena tipografía y foco en quien la usa.
      en: My graphic design background is what sets me apart. I treat every screen as a design piece, with clear hierarchy, good typography and a focus on the people using it.
    - es: Trabajo de forma independiente o en equipos ágiles, con arquitectura limpia, código mantenible, seguridad y comunicación clara.
      en: I work independently or in agile teams, with clean architecture, maintainable code, security and clear communication.

  values:
    - icon: strategy
      title:
        es: Estrategia
        en: Strategy
      text:
        es: Pienso los productos de punta a punta, de la idea al despliegue. Busco sumar esa visión en equipos colaborativos, técnicos y con ganas de innovar.
        en: I think about products end to end, from the idea to deployment. I want to bring that view to collaborative, technical teams that care about innovation.
    - icon: professionalism
      title:
        es: Profesionalismo
        en: Professionalism
      text:
        es: Años de trabajo freelance me dieron autonomía, responsabilidad y foco en resultados. Entrego soluciones escalables, seguras y bien terminadas.
        en: Years of freelance work gave me autonomy, ownership and a focus on results. I deliver scalable, secure and well-finished solutions.
    - icon: creativity
      title:
        es: Creatividad
        en: Creativity
      text:
        es: Resuelvo problemas complejos combinando pensamiento analítico y diseño, para construir experiencias útiles, modernas y fáciles de usar.
        en: I solve complex problems by combining analytical thinking with design, to build experiences that are useful, modern and easy to use.

