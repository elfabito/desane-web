  education:
    - es: Empecé como freelance en diseño gráfico, 3D y WordPress, y de ahí pasé de lleno al desarrollo de software.
      en: I started as a freelancer in graphic design, 3D and WordPress, and from there moved fully into software development.
    - es: Completé CS50 Web Programming with Python and JavaScript de Harvard, donde desarrollé seis proyectos desde cero, entre ellos una red social y un e-commerce.
      en: I completed Harvard's CS50 Web Programming with Python and JavaScript, building six projects from scratch, including a social network and an e-commerce platform.
    - es: Después profundicé en Python (Flask, Pandas e integración de APIs) e hice un bootcamp de JavaScript y React que simulaba un entorno laboral real.
      en: I then went deeper into Python (Flask, Pandas and API integration) and took a JavaScript and React bootcamp that simulated a real work environment.
    - es: Sigo aprendiendo de forma constante, y mis proyectos están documentados en GitHub.
      en: I keep learning constantly, and my projects are documented on GitHub.
